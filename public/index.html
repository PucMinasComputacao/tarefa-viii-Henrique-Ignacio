<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Filmes e Séries</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #13131c;
      --card: #1a1a28;
      --accent: #e8c84a;
      --accent2: #e8614a;
      --text: #e8e8f0;
      --muted: #6b6b88;
      --border: #2a2a40;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      padding: 2rem;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: var(--accent);
      color: var(--bg);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    .hint {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-left: 3px solid var(--accent2);
      padding-left: 0.8rem;
    }

    .hint kbd {
      background: var(--border);
      color: var(--text);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.75rem;
    }

    /* ── Output div ── */
    #output {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.8rem;
      line-height: 1.75;
    }

    #output h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    #output .section {
      margin-bottom: 1.4rem;
    }

    #output .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    #output .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.8rem;
      margin-top: 0.5rem;
    }

    #output .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 0.8rem 1rem;
    }

    #output .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      display: block;
      margin-bottom: 0.2rem;
    }

    #output .stat-value {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
    }

    #output .ranking-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    #output .ranking-item:last-child {
      border-bottom: none;
    }

    #output .rank-pos {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      color: var(--muted);
      width: 1.5rem;
      text-align: right;
    }

    #output .rank-pos.gold   { color: #f5c842; }
    #output .rank-pos.silver { color: #b0b0c8; }
    #output .rank-pos.bronze { color: #c87c42; }

    #output .rank-title {
      flex: 1;
    }

    #output .rank-nota {
      font-weight: 600;
      color: var(--accent2);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.65rem;
      color: var(--muted);
      text-align: right;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">Atividade — Iterators JS</div>
      <h1>Catálogo de<br><span>Filmes &amp; Séries</span></h1>
      <p class="hint">
        Abra o Console (<kbd>F12</kbd> → aba <strong>Console</strong>) para ver todos os resultados detalhados das iterações.
      </p>
    </header>

    <div id="output">
      <!-- Preenchido pelo script.js -->
      <p style="color:var(--muted); font-size:0.8rem;">⏳ Carregando resumo…</p>
    </div>

    <footer>Matrícula: 1638573</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
